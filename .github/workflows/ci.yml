name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          DUBDECK_API_HOST: dubdeck-api.example.com
      - run: test -f web/dist/.herenow/proxy.json && node -e "JSON.parse(require('fs').readFileSync('web/dist/.herenow/proxy.json'))"
      - run: node scripts/sync-access.mjs --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t dubdeck-server .
      - run: docker run --rm --entrypoint sh dubdeck-server -c "python -m yt_dlp --version && ffmpeg -version | head -1 && deno --version | head -1"
