name: Publish test site to real site

# Run by hand when the test site looks right: merges the test branch into
# main and publishes main to the real site. Also runs on every push to main
# (Editor saves on the real site) to publish them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - config/site.json
      - config/site-test.json
      - config/allowed-emails.json # applied by "Sync access allowlist"

permissions:
  contents: write

concurrency:
  group: herenow-deploy
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/test || { echo "::error::test and main changed the same lines. Ask Claude to resolve the conflict."; exit 1; }
          git push origin HEAD:main

  publish:
    needs: merge
    if: always() && (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    uses: ./.github/workflows/publish.yml
    with:
      site: real
    secrets: inherit
