name: Deploy web to here.now

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "server/**"
      - "config/allowed-emails.json" # handled by sync-access.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herenow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
      HERENOW_SLUG: ${{ vars.HERENOW_SLUG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check configuration
        run: |
          test -n "$HERENOW_API_KEY" || { echo "::error::Add the HERENOW_API_KEY repository secret."; exit 1; }
          test -n "${{ vars.DUBDECK_API_HOST }}" || { echo "::error::Add the DUBDECK_API_HOST repository variable (your tunnel hostname)."; exit 1; }
          node scripts/sync-access.mjs --check

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          DUBDECK_API_HOST: ${{ vars.DUBDECK_API_HOST }}
        run: npm run build

      # create → upload → finalize; fails on proxy.json / data.json warnings.
      - name: Publish to here.now
        id: publish
        run: node scripts/herenow-publish.mjs web/dist

      # Keep the Site restricted to the allowlist (also covers a freshly created Site).
      - name: Enforce restricted access
        env:
          HERENOW_SLUG: ${{ vars.HERENOW_SLUG || steps.publish.outputs.slug }}
        run: node scripts/sync-access.mjs
