name: Deploy web to here.now

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herenow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
      HERENOW_SLUG: ${{ vars.HERENOW_SLUG }}
      # Optional: with HF_TOKEN set, the backend is deployed to a free Hugging Face Space.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check configuration
        run: |
          test -n "$HERENOW_API_KEY" || { echo "::error::Add the HERENOW_API_KEY repository secret."; exit 1; }
          if [ -z "$HF_TOKEN" ] && [ -z "${{ vars.DUBDECK_API_HOST }}" ]; then
            echo "::error::Add the HF_TOKEN secret (Hugging Face backend) or the DUBDECK_API_HOST variable (your own backend)."; exit 1
          fi
          node scripts/sync-access.mjs --check

      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.13"

      # Creates/updates the Space, its secrets, and the here.now backend-key variable.
      - name: Deploy backend to Hugging Face
        id: hf
        if: env.HF_TOKEN != ''
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          DUBDECK_OWNER_PASSCODE: ${{ secrets.DUBDECK_OWNER_PASSCODE }}
          DUBDECK_OWNER_EMAIL: ${{ vars.DUBDECK_OWNER_EMAIL }}
          DUBDECK_BACKEND_KEY: ${{ secrets.DUBDECK_BACKEND_KEY }}
          DUBDECK_SIGNING_SECRET: ${{ secrets.DUBDECK_SIGNING_SECRET }}
        run: |
          pip install --quiet huggingface_hub==2.2.0
          python scripts/deploy-hf-space.py

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          DUBDECK_API_HOST: ${{ steps.hf.outputs.host || vars.DUBDECK_API_HOST }}
        run: npm run build

      # create → upload → finalize; fails on proxy.json / data.json warnings.
      - name: Publish to here.now
        id: publish
        run: node scripts/herenow-publish.mjs web/dist

      # Keep the Site restricted to the allowlist (also covers a freshly created Site).
      - name: Enforce restricted access
        env:
          HERENOW_SLUG: ${{ vars.HERENOW_SLUG || steps.publish.outputs.slug }}
        run: node scripts/sync-access.mjs
