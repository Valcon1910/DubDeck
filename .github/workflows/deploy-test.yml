name: Publish code to test site

# Run by hand to try new code: merges the code branch (and the latest real
# site, main) into the test branch and publishes it to the test site. Also
# runs on every push to test (Editor saves on the test site), which never
# touch main.
on:
  workflow_dispatch:
    inputs:
      code_branch:
        description: Branch with the new code
        default: claude/dubdeck-architecture-nxzvcz
  push:
    branches: [test]
    paths-ignore:
      - "**/*.md"
      - config/site.json
      - config/site-test.json

permissions:
  contents: write

concurrency:
  group: herenow-deploy
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: Merge the code and main into test
        env:
          CODE: ${{ inputs.code_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$CODE" main
          git merge --no-edit origin/main || { echo "::error::main and test changed the same lines. Ask Claude to resolve the conflict."; exit 1; }
          git merge --no-edit "origin/$CODE" || { echo "::error::$CODE and test changed the same lines. Ask Claude to resolve the conflict."; exit 1; }
          git push origin HEAD:test

  publish:
    needs: merge
    if: always() && (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    uses: ./.github/workflows/publish.yml
    with:
      site: test
    secrets: inherit
