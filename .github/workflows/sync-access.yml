name: Sync access allowlist

# Edit config/allowed-emails.json (published site) or config/allowed-emails-test.json
# (test site) → this makes each here.now Site's restricted-access list match it
# exactly (PATCH replaces the whole list).
on:
  push:
    branches: [main]
    paths:
      - config/allowed-emails.json
      - config/allowed-emails-test.json
      - scripts/sync-access.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herenow-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate files
        run: |
          node scripts/sync-access.mjs --check
          node scripts/sync-access.mjs --check config/allowed-emails-test.json

      - name: Apply to the published site
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          HERENOW_SLUG: ${{ vars.HERENOW_SLUG }}
        run: node scripts/sync-access.mjs

      - name: Apply to the test site
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          HERENOW_SITE_NAME: Vortex Engine (test)
          HERENOW_SITE_FILE: config/site-test.json
          HERENOW_ACCESS_FILE: config/allowed-emails-test.json
        run: node scripts/sync-access.mjs

      - name: Update Chat members
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/chat-sync.mjs
