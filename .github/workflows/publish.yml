name: Publish (shared steps)

# Builds one branch and publishes it to one here.now Site. Not run directly:
# "Publish code to test site" and "Publish test site to real site" use it.
#   site: real → branch main → flint-rivulet-2tep (config/site.json)
#   site: test → branch test → the test Site     (config/site-test.json)
on:
  workflow_call:
    inputs:
      site:
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
      HERENOW_SLUG: ${{ inputs.site == 'real' && vars.HERENOW_SLUG || '' }}
      HERENOW_SITE_NAME: ${{ inputs.site == 'test' && 'Vortex Engine (test)' || 'Vortex Engine' }}
      HERENOW_SITE_FILE: ${{ inputs.site == 'test' && 'config/site-test.json' || 'config/site.json' }}
      # Who can open it: the test site has its own, shorter list.
      HERENOW_ACCESS_FILE: ${{ inputs.site == 'test' && 'config/allowed-emails-test.json' || 'config/allowed-emails.json' }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      GH_EDIT_TOKEN: ${{ secrets.GH_EDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.site == 'test' && 'test' || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check configuration
        run: |
          test -n "$HERENOW_API_KEY" || { echo "::error::Add the HERENOW_API_KEY repository secret."; exit 1; }
          node scripts/sync-access.mjs --check
          test -n "$GH_EDIT_TOKEN" || echo "::warning::The GH_EDIT_TOKEN repository secret is missing, so the Editor can't save. Add it under Settings → Secrets and variables → Actions → Repository secrets."

      # Stores the RapidAPI key in here.now (pinned to the YTStream host) for the /yt proxy route.
      - name: Save RapidAPI key in here.now
        if: env.RAPIDAPI_KEY != ''
        env:
          VALUE: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/herenow-variable.mjs RAPIDAPI_KEY ytstream-download-youtube-videos.p.rapidapi.com youtube-info-download-api.p.rapidapi.com youtube138.p.rapidapi.com

      # Stores the editor's GitHub token in here.now (pinned to api.github.com) for the /gh route.
      - name: Save editor GitHub token in here.now
        if: env.GH_EDIT_TOKEN != ''
        env:
          VALUE: ${{ secrets.GH_EDIT_TOKEN }}
        run: node scripts/herenow-variable.mjs GITHUB_EDIT_TOKEN api.github.com

      # The public "Apply" page (web/apply): its own Site that anyone can open,
      # where people who can't sign in ask for access. Admin → Applications reads
      # the requests through the site's /ap route, which adds HN_OWNER_KEY.
      # Only the real site's publish updates it (it always points to the real site).
      - name: Publish the Apply page
        id: apply
        if: inputs.site == 'real'
        env:
          HERENOW_SLUG: ""
          HERENOW_SITE_NAME: Vortex Apply
          HERENOW_SITE_FILE: config/site-apply.json
          DUBDECK_ALLOW_NO_PROXY: "1"
        run: |
          if [ ! -d web/apply ]; then echo "No web/apply on this branch yet."; exit 0; fi
          node scripts/build-apply.mjs /tmp/apply-dist
          node scripts/herenow-publish.mjs /tmp/apply-dist
          HERENOW_ACCESS_MODE=public node scripts/sync-access.mjs

      - name: Save the owner key for the Applications list
        if: env.HERENOW_API_KEY != ''
        env:
          VALUE: ${{ secrets.HERENOW_API_KEY }}
        run: node scripts/herenow-variable.mjs HN_OWNER_KEY here.now

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          DUBDECK_API_HOST: ${{ vars.DUBDECK_API_HOST }}
          VORTEX_BRANCH: ${{ inputs.site == 'test' && 'test' || 'main' }}
          APPLY_SLUG: ${{ steps.apply.outputs.slug }}
        run: npm run build

      # create → upload → finalize; fails on proxy.json / data.json warnings.
      - name: Publish to here.now
        id: publish
        run: node scripts/herenow-publish.mjs web/dist

      # Remember the Site's address on main, so every later publish updates
      # the same Site. (Pushes made with this token don't start new runs.)
      - name: Remember the site address
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for F in "$HERENOW_SITE_FILE" config/site-apply.json; do
            [ -f "$F" ] && [ -n "$(git status --porcelain "$F")" ] || continue
            cp "$F" /tmp/site.json
            for b in main test; do
              git fetch origin $b && git checkout -f -B save-$b origin/$b && cp /tmp/site.json "$F"
              git add "$F" && git commit -m "Remember the address in $F" && git push origin HEAD:$b || true
            done
          done

      - name: Enforce restricted access
        env:
          HERENOW_SLUG: ${{ steps.publish.outputs.slug }}
        run: node scripts/sync-access.mjs
