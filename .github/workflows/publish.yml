name: Publish (shared steps)

# Builds one branch and publishes it to one here.now Site. Not run directly:
# "Publish code to test site" and "Publish test site to real site" use it.
#   site: real → branch main → flint-rivulet-2tep (config/site.json)
#   site: test → branch test → the test Site     (config/site-test.json)
on:
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      # Merged in first, on the same machine (one machine per publish is faster):
      #   "code:<branch>" → main, then that code branch, into test
      #   "test"          → test into main (+ an Update log entry)
      #   "main"          → main into test
      merge:
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
      HERENOW_SLUG: ${{ inputs.site == 'real' && vars.HERENOW_SLUG || '' }}
      HERENOW_SITE_NAME: ${{ inputs.site == 'test' && 'Vortex Engine (test)' || 'Vortex Engine' }}
      HERENOW_SITE_FILE: ${{ inputs.site == 'test' && 'config/site-test.json' || 'config/site.json' }}
      # Who can open it: the test site has its own, shorter list.
      HERENOW_ACCESS_FILE: ${{ inputs.site == 'test' && 'config/allowed-emails-test.json' || 'config/allowed-emails.json' }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      GH_EDIT_TOKEN: ${{ secrets.GH_EDIT_TOKEN }}
      # Chat (Supabase). Without these, Chat shows "Coming soon".
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.site == 'test' && 'test' || 'main' }}
          fetch-depth: ${{ inputs.merge != '' && '0' || '1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Merge changes in
        if: inputs.merge != ''
        env:
          MERGE: ${{ inputs.merge }}
          TARGET: ${{ inputs.site == 'test' && 'test' || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.vortexjson.driver "node scripts/merge-json.mjs %O %A %B"
          conflict() { echo "::error::$1 changed the same lines. Ask Claude to resolve the conflict."; exit 1; }
          case "$MERGE" in
            code:*)
              CODE="${MERGE#code:}"
              git fetch -q origin main "$CODE"
              VORTEX_MAIN=theirs git merge --no-edit origin/main || conflict "main and test"
              VORTEX_MAIN=ours git merge --no-edit "origin/$CODE" || conflict "$CODE and test" ;;
            test)
              git fetch -q origin test
              VORTEX_MAIN=ours git merge --no-edit origin/test || conflict "test and main"
              # A dated entry in the home page's Update log for this publish.
              node scripts/add-update.mjs && git commit -qam "Update log: publish of $(date -u +%Y-%m-%d)" ;;
            main)
              git fetch -q origin main
              VORTEX_MAIN=theirs git merge --no-edit origin/main || conflict "main and test" ;;
            *) echo "::error::Unknown merge: $MERGE"; exit 1 ;;
          esac
          git push origin "HEAD:$TARGET"

      - name: Check configuration
        run: |
          test -n "$HERENOW_API_KEY" || { echo "::error::Add the HERENOW_API_KEY repository secret."; exit 1; }
          node scripts/sync-access.mjs --check
          test -n "$GH_EDIT_TOKEN" || echo "::warning::The GH_EDIT_TOKEN repository secret is missing, so the Editor can't save. Add it under Settings → Secrets and variables → Actions → Repository secrets."

      # Stores the RapidAPI key in here.now (pinned to the YTStream host) for the /yt proxy route.
      - name: Save RapidAPI key in here.now
        if: env.RAPIDAPI_KEY != ''
        env:
          VALUE: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/herenow-variable.mjs RAPIDAPI_KEY ytstream-download-youtube-videos.p.rapidapi.com youtube-info-download-api.p.rapidapi.com youtube138.p.rapidapi.com

      # Stores the editor's GitHub token in here.now (pinned to api.github.com) for the /gh route.
      - name: Save editor GitHub token in here.now
        if: env.GH_EDIT_TOKEN != ''
        env:
          VALUE: ${{ secrets.GH_EDIT_TOKEN }}
        run: node scripts/herenow-variable.mjs GITHUB_EDIT_TOKEN api.github.com

      # Applies database changes and lets in anyone newly added to the access lists.
      - name: Update Chat
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: node scripts/chat-sync.mjs --schema

      # The Hexdrift record checker, deployed per physics version (hexdrift-v3, …)
      # so the test site's newer physics never rejects the real site's runs.
      - name: Update the Hexdrift record checker
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          node scripts/hexdrift-share.mjs --check
          V=$(node -e "console.log(require('fs').readFileSync('web/src/hexdrift/sim/race.ts','utf8').match(/PHYSICS_V = (\d+)/)[1])")
          cp -r supabase/functions/hexdrift-submit "supabase/functions/hexdrift-v$V"
          npx -y supabase@2.122.1 functions deploy "hexdrift-v$V" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          # Community Maps publishing (re-drives each map's author run), per physics version too.
          cp -r supabase/functions/hexdrift-maps "supabase/functions/hexdrift-maps-v$V"
          npx -y supabase@2.122.1 functions deploy "hexdrift-maps-v$V" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          DUBDECK_API_HOST: ${{ vars.DUBDECK_API_HOST }}
          VORTEX_BRANCH: ${{ inputs.site == 'test' && 'test' || 'main' }}
        run: npm run build

      # create → upload → finalize; fails on proxy.json / data.json warnings.
      - name: Publish to here.now
        id: publish
        run: node scripts/herenow-publish.mjs web/dist

      # Remember the Site's address on main, so every later publish updates
      # the same Site. (Pushes made with this token don't start new runs.)
      - name: Remember the site address
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for F in "$HERENOW_SITE_FILE"; do
            [ -f "$F" ] && [ -n "$(git status --porcelain "$F")" ] || continue
            cp "$F" /tmp/site.json
            for b in main test; do
              git fetch origin $b && git checkout -f -B save-$b origin/$b && cp /tmp/site.json "$F"
              git add "$F" && git commit -m "Remember the address in $F" && git push origin HEAD:$b || true
            done
          done

      - name: Enforce restricted access
        env:
          HERENOW_SLUG: ${{ steps.publish.outputs.slug }}
        run: node scripts/sync-access.mjs
