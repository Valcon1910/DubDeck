<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply to Vortex</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d14; --card:#151925; --text:#e8eaf2; --muted:#9aa1b5; --accent:#7c5cff; --line:#262b3b; --bad:#ff6b6b; --ok:#3ddc97; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:radial-gradient(circle at 30% 0%, #241a4d 0, var(--bg) 60%); color:var(--text); font:16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 20px 60px #0008; }
  h1 { margin:0 0 4px; font-size:1.6rem; } p { margin:0 0 18px; color:var(--muted); }
  label { display:block; font-size:.9rem; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#0e111a; color:var(--text); font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:600 1rem system-ui, sans-serif; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:16px; padding:12px; border-radius:10px; font-size:.95rem; }
  .bad { background:#ff6b6b22; color:var(--bad); } .ok { background:#3ddc9722; color:var(--ok); }
  .logo { font-size:2rem; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🌀</div>
  <h1>Apply to Vortex</h1>
  <p>Vortex is invite-only. Couldn't sign in? Ask for access here. If you're accepted, you'll get an email with the site's address.</p>
  <form id="f" novalidate>
    <label for="email">Your email (the one you'll sign in with)</label>
    <input id="email" name="email" type="email" required maxlength="200" autocomplete="email" placeholder="name@example.com">
    <label for="name">Your name</label>
    <input id="name" name="name" required maxlength="80" autocomplete="name">
    <label for="reason">Who do you know here? (optional)</label>
    <textarea id="reason" name="reason" maxlength="500"></textarea>
    <button id="b">Apply</button>
    <div id="m" class="msg" role="status" hidden></div>
  </form>
</main>
<script>
const f = document.getElementById("f"), b = document.getElementById("b"), m = document.getElementById("m");
const show = (ok, t) => { m.hidden = false; m.className = "msg " + (ok ? "ok" : "bad"); m.textContent = t; };
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = f.email.value.trim().toLowerCase(), name = f.name.value.trim(), reason = f.reason.value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show(false, "That isn't a valid email address.");
  if (!name) return show(false, "Please add your name.");
  b.disabled = true;
  try {
    const r = await fetch("./.herenow/data/applications", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(reason ? { email, name, reason } : { email, name }) });
    if (r.status === 429) throw new Error("Too many tries. Wait a bit and try again.");
    if (!r.ok) throw new Error("Couldn't send it. Try again.");
    f.querySelectorAll("input, textarea, button").forEach((x) => (x.disabled = true));
    show(true, "Sent! You'll get an email at " + email + " if you're accepted.");
  } catch (err) { show(false, err.message); b.disabled = false; }
});
</script>
</body>
</html>
