# Render Blueprint: runs the DubDeck backend on Render's FREE plan (no card needed).
# Free-plan limits: sleeps after ~15 min idle (about a minute to wake), 512 MB RAM,
# and the disk is wiped on every restart. DubDeck handles that: sign-in tokens are
# self-contained, settings are restored from your device, and finished downloads are
# saved straight to your device (DUBDECK_EPHEMERAL=1).
services:
  - type: web
    name: dubdeck-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true # pushes to main (e.g. allowlist edits) redeploy automatically
    envVars:
      # Generated by Render. Copy DUBDECK_BACKEND_KEY into the here.now variable of the same name.
      - key: DUBDECK_BACKEND_KEY
        generateValue: true
      - key: DUBDECK_SIGNING_SECRET
        generateValue: true
      # You type these in the Render dashboard when creating the Blueprint.
      - key: DUBDECK_OWNER_PASSCODE
        sync: false
      - key: DUBDECK_OWNER_EMAIL
        sync: false
      - key: DUBDECK_EPHEMERAL
        value: "1"
      - key: DUBDECK_TRUST_CF_HEADERS
        value: "0"
      - key: DUBDECK_DATA_DIR
        value: /data
