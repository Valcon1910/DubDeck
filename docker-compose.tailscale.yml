# Free alternative to Cloudflare Tunnel (no domain needed): Tailscale Funnel gives the
# backend a permanent public address like https://dubdeck.<your-tailnet>.ts.net
#   docker compose -f docker-compose.tailscale.yml up -d --build
#   docker compose -f docker-compose.tailscale.yml exec dubdeck dubdeck-update-ytdlp

services:
  dubdeck:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: dubdeck-server
    env_file: server/.env
    volumes:
      - dubdeck-data:/data
      - ./config:/app/config:ro
    restart: unless-stopped
    expose:
      - "8000"

  tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: dubdeck
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env next to this file}
      TS_HOSTNAME: dubdeck
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - dubdeck
    restart: unless-stopped

volumes:
  dubdeck-data:
  tailscale-state:
